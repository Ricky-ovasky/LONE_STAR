<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LONE-$TAR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

    <style>

        /* ==========================
           RESET
        ========================== */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Montserrat",sans-serif;
        }

        body{
            overflow:hidden;
            color:#fff;
        }

        /* ==========================
           BACKGROUND VIDEO
        ========================== */

        video{
            position:fixed;
            inset:0;
            width:100%;
            height:100%;
            object-fit:cover;
            z-index:-2;
        }

        .overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.45);
            z-index:-1;
        }

        /* ==========================
           NAVBAR
        ========================== */

        nav{
            position:absolute;
            top:0;
            left:0;
            width:100%;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:30px 70px;
        }

        .logo{
            font-size:30px;
            font-weight:700;
            letter-spacing:6px;
        }

        ul{
            display:flex;
            gap:35px;
            list-style:none;
        }

        ul li a{
            text-decoration:none;
            color:white;
            font-size:15px;
            letter-spacing:2px;
            transition:.3s;
        }

        ul li a:hover{
            color:#d4af37;
        }

        /* ==========================
           HERO
        ========================== */

        .hero{
            height:100vh;

            display:flex;
            align-items:center;

            padding:0 70px;
        }

        .content{
            max-width:650px;
        }

        .content h1{
            font-size:70px;
            line-height:1.1;
            margin-bottom:20px;
        }

        .content p{
            font-size:18px;
            line-height:1.8;
            opacity:.9;
            margin-bottom:35px;
        }

        .btn{
            display:inline-block;

            padding:16px 42px;

            border:2px solid white;

            color:white;
            text-decoration:none;
            letter-spacing:2px;

            transition:.3s;
        }

        .btn:hover{
            background:white;
            color:black;
        }

        /* ==========================
           MOBILE
        ========================== */

        @media (max-width:800px){

            nav{
                padding:20px;
            }

            ul{
                gap:15px;
            }

            .logo{
                font-size:22px;
            }

            .hero{
                padding:20px;
            }

            .content h1{
                font-size:42px;
            }

            .content p{
                font-size:16px;
            }

        }

    </style>

</head>

<body>

    <!-- Background Video -->

    <video autoplay muted loop playsinline>

        <source src="car.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>

    <!-- Navigation -->

    <nav>

        <div class="logo">
            LONE-$TAR
        </div>

        <ul>
            <li><a href="#">HOME</a></li>
            <li><a href="#">CARS</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONTACT</a></li>
        </ul>

    </nav>

    <!-- Hero -->

    <section class="hero">

        <div class="content">

            <h1>Drive Beyond Luxury.</h1>

            <p>
                Discover an exclusive collection of the world's most prestigious luxury vehicles.
                Engineered for performance, designed for elegance, and crafted to leave a lasting impression.
            </p>

            <a href="#" class="btn">EXPLORE</a>

        </div>

    </section>

</body>

</html>
